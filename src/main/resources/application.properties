spring.application.name=ace

# ---------- Banco de dados (PostgreSQL) ----------
# Use SSL na conexão: o DB_URL deve terminar com ?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Administrador ----------
# A senha não tem valor padrão: o sistema não sobe sem ADMIN_PASSWORD
# (mínimo de 10 caracteres).
app.admin.email=${ADMIN_EMAIL:admin@alessandrosilva.com}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nome=${ADMIN_NOME:Administrador}

# ---------- Servidor ----------
server.port=${PORT:8080}
server.servlet.session.timeout=8h
# Atrás do proxy HTTPS da hospedagem: confia nos cabeçalhos X-Forwarded-* vindos
# de proxies da rede interna, para o sistema saber que a conexão é HTTPS
# (cookies Secure e cabeçalho HSTS).
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.error.include-stacktrace=never
server.error.include-message=never
