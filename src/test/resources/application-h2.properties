# Perfil de desenvolvimento/testes: banco H2 em memoria (os dados somem ao reiniciar).
# Uso: mvnw spring-boot:test-run  (classe ace.TestAceApplication)
spring.datasource.url=jdbc:h2:mem:ace;DB_CLOSE_DELAY=-1
# Sobrescreve o driver do PostgreSQL definido no application.properties principal.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Valores de teste, para o perfil funcionar mesmo sem o application.properties (ignorado pelo git)
app.admin.email=admin@alessandrosilva.com
app.admin.password=alessandro123
app.admin.nome=Administrador
# Somente para testes/desenvolvimento local: aceita a senha de exemplo acima.
app.admin.permitir-senha-fraca=true
